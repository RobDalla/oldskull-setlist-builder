<head>

  <title>Oldsküll Setlist Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #f2f2f2;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      opacity: 0;
      transition: opacity 0.35s ease;
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
    }

    body.manowar-mode::before {
      opacity: 1;
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.82),
          rgba(0, 0, 0, 0.93)
        ),
        url("oldskull-manowar.jpeg");
    }

    body.manowar-mode {
      background: #050505;
    }

    header {
      background: rgba(17, 17, 17, 0.97);
      border-bottom: 1px solid #444;
      padding: 24px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .header-content {
      max-width: 1050px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .brand img {
      width: 320px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .brand p {
      margin: 12px 0 0;
      color: #999;
      font-size: 15px;
    }

    body.manowar-mode #modeSubtitle {
      color: #c9b36e;
    }

    .counter {
      text-align: right;
      min-width: 190px;
    }

    #trackCount {
      color: #aaa;
      font-weight: bold;
      font-size: 14px;
    }

    #totalTime {
      font-size: 36px;
      font-weight: bold;
      margin-top: 5px;
      white-space: nowrap;
    }

    .mode-area {
      margin-top: 22px;
    }

    .mode-label {
      color: #777;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-button {
      padding: 13px 16px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #171717;
      color: #aaa;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-button:hover {
      border-color: #777;
      color: #fff;
    }

    .mode-button.active {
      background: #eee;
      border-color: #eee;
      color: #111;
    }

    body.manowar-mode #manowarModeButton.active {
      background: #6f0909;
      border-color: #a61a1a;
      color: #fff;
      box-shadow: 0 0 18px rgba(180, 20, 20, 0.22);
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .action-button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #1b1b1b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-button:hover {
      background: #292929;
    }

    #copyButton {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    #copyButton:hover {
      background: white;
    }

    body.manowar-mode #copyButton {
      background: #7c0c0c;
      border-color: #a71d1d;
      color: white;
    }

    body.manowar-mode #copyButton:hover {
      background: #981515;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 28px 20px 70px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section-title {
      color: #999;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .section-hint {
      color: #666;
      font-size: 12px;
      text-align: right;
    }

    body.manowar-mode .section-title {
      color: #c9b36e;
    }

    .song {
      display: flex;
      align-items: center;

      border: 1px solid #292929;

      transition: 0.2s;

    }

    .song:hover {
      border-color: #666;
      transform: translateY(-1px);
    }

    .song.selected {
      border-color: #777;
      background: rgba(27, 27, 27, 0.97);
    }

    body.manowar-mode .song.selected {
      border-color: #7a2929;
      background: rgba(37, 12, 12, 0.95);
    }

    .song input {
      width: 22px;
      height: 22px;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: #ddd;
    }

    body.manowar-mode .song input {
      accent-color: #a30f0f;
    }

    .order-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: bold;
      background: #222;
      border: 1px solid #444;
      color: #777;
      opacity: 0;
      transform: scale(0.82);
      transition: 0.2s;
    }

    .order-badge.active {
      opacity: 1;
      transform: scale(1);
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    body.manowar-mode .order-badge.active {
      background: #931010;
      border-color: #c52626;
      color: #fff;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.2;
    }

    .artist {
      margin-top: 5px;
      font-size: 13px;
      color: #777;
    }

    body.manowar-mode .artist {
      color: #887f69;
    }

    .duration {
      font-family: monospace;
      font-size: 16px;
      color: #bbb;
      flex-shrink: 0;
    }

    footer {
      max-width: 1050px;
      margin: 0 auto 40px;
      padding: 0 20px;
      color: #555;
      font-size: 12px;
      text-align: center;
    }

    /* ÁREA EXCLUSIVA DE IMPRESSÃO */

    #printArea {
      display: none;
    }

    @media (max-width: 650px) {
      header {
        position: relative;
      }

        display: block;
      }

        width: 285px;
      }

      .counter {
        text-align: left;
        margin-top: 22px;
      }

      #totalTime {

      }

      .mode-buttons {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      .section-header {
        display: block;
      }

      .section-hint {
        text-align: left;
        margin-top: 7px;
      }

      .song {
        gap: 10px;
        padding: 14px;
      }

      .song-title {
        font-size: 16px;
      }

      .artist {
        font-size: 12px;
      }

      .order-badge {
        width: 29px;
        height: 29px;
        font-size: 13px;
      }

      .duration {
        font-size: 14px;
      }

      body.manowar-mode::before {
        background-position: center top;
      }
    }

    /* IMPRESSÃO A4 */

    @page {
      size: A4;
      margin: 15mm;
    }

    @media print {
      html, body {
        background: white !important;
        color: black !important;
        margin: 0;
        padding: 0;
      }

      body::before {
        display: none !important;
      }

      header, main, footer {
        display: none !important;
      }

      #printArea {
        display: block !important;
        width: 100%;
        font-family: Arial, Helvetica, sans-serif;
        color: black;
      }

      .print-logo {
        display: block;
        width: auto;
        max-width: 145mm;
        max-height: 48mm;
        height: auto;
        object-fit: contain;
        margin: 0 auto 8mm;
      }

      .print-heading {
        text-align: center;
        font-size: 14pt;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 8mm;
      }

      .print-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11pt;
      }

      .print-table th {
        text-align: left;
        border-bottom: 2px solid #222;
        padding: 7px 5px;
      }

      .print-table td {
        border-bottom: 1px solid #ddd;
        padding: 7px 5px;
      }

      .print-table tr {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .print-number {
        width: 10%;
        text-align: center;
      }

      .print-duration {
        width: 18%;
        text-align: right !important;
        white-space: nowrap;
      }

      .print-total {
        margin-top: 10mm;
        padding-top: 4mm;
        border-top: 2px solid black;
        text-align: right;
        font-size: 14pt;
        font-weight: bold;
        break-inside: avoid;
      }

      .print-count {
        margin-top: 4mm;
        text-align: right;
        font-size: 10pt;
        color: #444;
      }
    }
  </style>
</head>

/*

const manowarSongs = [
  {

  },
  {

    duration: "7:50"
  }
];

/*
========================================
ESTADO DOS DOIS REPERTÓRIOS
========================================
*/

let currentMode = "covers";

const selectionState = {
  covers: [],
  manowar: []
};

function getCurrentSongs() {
  return currentMode === "manowar"
    ? manowarSongs
    : coversSongs;
}

function getCurrentSelection() {
  return selectionState[currentMode];
}

/*
========================================
CÁLCULO DE TEMPO
========================================
*/

function timeToSeconds(time) {
  const parts = time.split(":");

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );
}

function formatTime(totalSeconds) {
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  return (
    hours + "h " +
    String(minutes).padStart(2, "0") + "m " +
    String(seconds).padStart(2, "0") + "s"
  );
}

function getTotalSeconds() {
  const songs = getCurrentSongs();
  const selection = getCurrentSelection();

  return selection.reduce((total, index) => {
    return total + timeToSeconds(songs[index].duration);
  }, 0);
}

/*
========================================
TROCA DE REPERTÓRIO
========================================
*/

function switchMode(mode) {
  if (mode !== "covers" && mode !== "manowar") {
    return;
  }

  currentMode = mode;

  const isManowar = mode === "manowar";

  document.body.classList.toggle(
    "manowar-mode",
    isManowar
  );

  document.getElementById("coversModeButton")
    .classList.toggle("active", !isManowar);

  document.getElementById("manowarModeButton")
    .classList.toggle("active", isManowar);

  document.getElementById("modeSubtitle").textContent =
    isManowar
      ? "Setlist Builder • Plays Manowar"
      : "Setlist Builder • Covers";

  document.getElementById("sectionTitle").textContent =
    isManowar
      ? "OLDSKÜLL PLAYS MANOWAR"
      : "OLDSKÜLL — COVERS";

  renderSongs();
  updateTotal();
}

/*
========================================
RENDERIZAÇÃO DAS MÚSICAS
========================================
*/

function renderSongs() {
  const songs = getCurrentSongs();
  const selection = getCurrentSelection();
  const list = document.getElementById("songList");

  list.innerHTML = "";

  songs.forEach((song, index) => {
    const item = document.createElement("label");
    item.className = "song";

    const position = selection.indexOf(index);
    const isSelected = position !== -1;

    if (isSelected) {
      item.classList.add("selected");
    }

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.dataset.index = index;
    checkbox.checked = isSelected;

    checkbox.addEventListener("change", function() {
      handleSelection(this);
    });

    const badge = document.createElement("span");
    badge.className = "order-badge";

    if (isSelected) {
      badge.classList.add("active");
      badge.textContent = position + 1;
    }

    const info = document.createElement("div");
    info.className = "song-info";

    const title = document.createElement("div");
    title.className = "song-title";
    title.textContent = song.title;

    const artist = document.createElement("div");
    artist.className = "artist";
    artist.textContent = song.artist;

    info.appendChild(title);
    info.appendChild(artist);

    const duration = document.createElement("div");
    duration.className = "duration";
    duration.textContent = song.duration;

    item.appendChild(checkbox);
    item.appendChild(badge);
    item.appendChild(info);
    item.appendChild(duration);

    list.appendChild(item);
  });
}

/*
========================================
SELEÇÃO NA ORDEM DOS CLIQUES
========================================
*/

function handleSelection(box) {
  const index = Number(box.dataset.index);
  let selection = getCurrentSelection();

  if (box.checked) {
    if (!selection.includes(index)) {
      selection.push(index);
    }
  } else {
    selectionState[currentMode] =
      selection.filter(item => item !== index);
  }

  renderSongs();
  updateTotal();
}

/*
========================================
CONTADOR E TEMPO TOTAL
========================================
*/

function updateTotal() {
  const songs = getCurrentSongs();
  const selection = getCurrentSelection();

  document.getElementById("trackCount").textContent =
    selection.length +
    " DE " +
    songs.length +
    " FAIXAS";

  document.getElementById("totalTime").textContent =
    formatTime(getTotalSeconds());
}

/*
========================================
LIMPAR APENAS O REPERTÓRIO ATUAL
========================================
*/

function clearSetlist() {
  selectionState[currentMode] = [];

  renderSongs();
  updateTotal();
}

/*
========================================
COPIAR SETLIST
========================================
*/

function copySetlist() {
  const songs = getCurrentSongs();
  const selection = getCurrentSelection();

  if (selection.length === 0) {
    alert("Selecione pelo menos uma música.");
    return;
  }

  let text = currentMode === "manowar"
    ? "OLDSKÜLL PLAYS MANOWAR\n\n"
    : "OLDSKÜLL — SETLIST\n\n";

  selection.forEach((songIndex, position) => {
    const song = songs[songIndex];

    text +=
      (position + 1) +
      ". " +
      song.title +
      " — " +
      song.duration +
      "\n";
  });

  text +=
    "\nTEMPO TOTAL: " +
    formatTime(getTotalSeconds());

  navigator.clipboard.writeText(text)
    .then(() => {
      const button = document.getElementById("copyButton");
      const originalText = button.textContent;

      button.textContent = "✓ Setlist copiado!";

      setTimeout(() => {
        button.textContent = originalText;
      }, 1500);
    })
    .catch(() => {
      alert("Não foi possível copiar automaticamente.");
    });
}

/*
========================================
IMPRESSÃO COM LOGOTIPO CORRETO
========================================
*/

function printSetlist() {
  const songs = getCurrentSongs();
  const selection = getCurrentSelection();

  if (selection.length === 0) {
    alert("Selecione pelo menos uma música antes de imprimir.");
    return;
  }

  const isManowar = currentMode === "manowar";

  const logo = isManowar
    ? "oldskull-plays-manowar.jpeg"
    : "oldskull-logo.png";

  const heading = isManowar
    ? "OLDSKÜLL PLAYS MANOWAR"
    : "OLDSKÜLL — SETLIST";

  const printArea = document.getElementById("printArea");

  // Limpa a impressão anterior.
  printArea.innerHTML = "";

  const logoElement = document.createElement("img");
  logoElement.className = "print-logo";
  logoElement.src = logo;
  logoElement.alt = heading;

  const headingElement = document.createElement("div");
  headingElement.className = "print-heading";
  headingElement.textContent = heading;

  const table = document.createElement("table");
  table.className = "print-table";

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  ["Nº", "MÚSICA", "DURAÇÃO"].forEach((label, index) => {
    const th = document.createElement("th");
    th.textContent = label;

    if (index === 0) {
      th.className = "print-number";
    }

    if (index === 2) {
      th.className = "print-duration";
    }

    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  selection.forEach((songIndex, position) => {
    const song = songs[songIndex];
    const row = document.createElement("tr");

    const numberCell = document.createElement("td");
    numberCell.className = "print-number";
    numberCell.textContent = position + 1;

    const titleCell = document.createElement("td");
    titleCell.textContent = song.title;

    const durationCell = document.createElement("td");
    durationCell.className = "print-duration";
    durationCell.textContent = song.duration;

    row.appendChild(numberCell);
    row.appendChild(titleCell);
    row.appendChild(durationCell);

    tbody.appendChild(row);
  });

  table.appendChild(tbody);

  const total = document.createElement("div");
  total.className = "print-total";
  total.textContent =
    "TEMPO TOTAL: " +
    formatTime(getTotalSeconds());

  const count = document.createElement("div");
  count.className = "print-count";
  count.textContent =
    selection.length +
    (selection.length === 1 ? " música selecionada" : " músicas selecionadas");

  printArea.appendChild(logoElement);
  printArea.appendChild(headingElement);
  printArea.appendChild(table);
  printArea.appendChild(total);
  printArea.appendChild(count);

  // Aguarda o carregamento do logotipo.
  if (logoElement.complete) {
    window.print();
  } else {
    logoElement.onload = () => window.print();

    logoElement.onerror = () => {
      alert(
        "O logotipo não foi encontrado. Confira o nome do arquivo no GitHub."
      );
    };
  }
}

/*
========================================
INICIALIZAÇÃO
========================================
*/

switchMode("covers");

</script>
