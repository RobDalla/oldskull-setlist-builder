<html lang="pt-BR">

<head>

    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Oldsküll Setlist Builder</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #080808;

      color: #f2f2f2;

      min-height: 100vh;
    }


    /*
    ========================================
    FUNDO MANOWAR
    ========================================
    */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: -2;

      opacity: 0;

      transition:
        opacity 0.35s ease;

      background-size: cover;

      background-position:
        center 25%;

      background-repeat: no-repeat;

    }


    body.manowar-mode::before {

      opacity: 1;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.82),
          rgba(0, 0, 0, 0.93)
        ),
        url("oldskull-manowar.jpeg");

    }


    body.manowar-mode {

      background: #050505;

    }


    /*
    ========================================
    CABEÇALHO
    ========================================
    */

    header {

      background:
        rgba(17, 17, 17, 0.97);

      border-bottom:
        1px solid #444;

      padding:
        24px 20px;

      position: sticky;

      top: 0;

      z-index: 20;

      backdrop-filter:
        blur(8px);

    }


    .header-content {

      max-width: 1050px;

      margin: auto;

    }


    .top {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 30px;

      flex-wrap: wrap;

    }


    /*
    ========================================
    LOGO
    ========================================
    */

    .brand img {

      width: 320px;

      max-width: 100%;

      height: auto;

      display: block;

    }


    .brand p {

      margin:
        12px 0 0;

      color: #999;

      font-size: 15px;

    }


    #modeSubtitle {

      transition:
        color 0.25s ease;

    }


    body.manowar-mode
    #modeSubtitle {

      color: #c9b36e;

    }


    /*
    ========================================
    CONTADOR
    ========================================
    */

    .counter {

      text-align: right;

      min-width: 190px;

    }


    #trackCount {

      color: #aaa;

      font-weight: bold;

      font-size: 14px;

    }


    #totalTime {

      font-size: 36px;

      font-weight: bold;

      margin-top: 5px;

      white-space: nowrap;

    }


    /*
    ========================================
    SELETOR DE REPERTÓRIO
    ========================================
    */

    .mode-area {

      margin-top: 22px;

    }


    .mode-label {

      color: #777;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 2px;

      margin-bottom: 9px;

    }


    .mode-buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

    }


    .mode-button {

      padding:
        13px 16px;

      border-radius: 9px;

      border:
        1px solid #444;

      background:
        #171717;

      color: #aaa;

      font-weight: bold;

      cursor: pointer;

      transition:
        0.2s;

    }


    .mode-button:hover {

      border-color: #777;

      color: #fff;

    }


    .mode-button.active {

      background: #eee;

      border-color: #eee;

      color: #111;

    }


    body.manowar-mode
    #manowarModeButton.active {

      background: #6f0909;

      border-color: #a61a1a;

      color: #fff;

      box-shadow:
        0 0 18px
        rgba(180, 20, 20, 0.22);

    }


    /*
    ========================================
    BOTÕES PRINCIPAIS
    ========================================
    */

    .buttons {

      display: flex;

      gap: 12px;

      margin-top: 14px;

    }


    .action-button {

      flex: 1;

      padding: 14px;

      border-radius: 8px;

      border:
        1px solid #555;

      background: #1b1b1b;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition:
        0.2s;

    }


    .action-button:hover {

      background: #292929;

    }


    #copyButton {

      background: #eee;

      color: #111;

      border-color: #eee;

    }


    #copyButton:hover {

      background: white;

    }


    body.manowar-mode
    #copyButton {

      background: #7c0c0c;

      border-color: #a71d1d;

      color: white;

    }


    body.manowar-mode
    #copyButton:hover {

      background: #981515;

    }


    /*
    ========================================
    CONTEÚDO
    ========================================
    */

    main {

      max-width: 1050px;

      margin: auto;

      padding:
        28px 20px 70px;

    }


    .section-header {

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap: 20px;

      margin-bottom: 18px;

    }


    .section-title {

      color: #999;

      font-size: 14px;

      font-weight: bold;

      letter-spacing: 2px;

    }


    .section-hint {

      color: #666;

      font-size: 12px;

      text-align: right;

    }


    body.manowar-mode
    .section-title {

      color: #c9b36e;

    }


    /*
    ========================================
    MÚSICAS
    ========================================
    */

    .song {

      display: flex;

      align-items: center;

      gap: 14px;

      background:
        rgba(17, 17, 17, 0.94);

      border:
        1px solid #292929;

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 11px;

      cursor: pointer;

      transition:
        0.2s;

      backdrop-filter:
        blur(4px);

    }


    .song:hover {

      border-color: #666;

      transform:
        translateY(-1px);

    }


    .song.selected {

      border-color: #777;

      background:
        rgba(27, 27, 27, 0.97);

    }


    body.manowar-mode
    .song.selected {

      border-color: #7a2929;

      background:
        rgba(37, 12, 12, 0.95);

    }


    /*
    ========================================
    CHECKBOX
    ========================================
    */

    .song input {

      width: 22px;

      height: 22px;

      cursor: pointer;

      flex-shrink: 0;

      accent-color: #ddd;

    }


    body.manowar-mode
    .song input {

      accent-color: #a30f0f;

    }


    /*
    ========================================
    NÚMERO DA ORDEM
    ========================================
    */

    .order-badge {

      width: 34px;

      height: 34px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      font-size: 15px;

      font-weight: bold;

      background: #222;

      border:
        1px solid #444;

      color: #777;

      opacity: 0;

      transform:
        scale(0.82);

      transition:
        0.2s;

    }


    .order-badge.active {

      opacity: 1;

      transform:
        scale(1);

      background: #eee;

      color: #111;

      border-color: #eee;

    }


    body.manowar-mode
    .order-badge.active {

      background: #931010;

      border-color: #c52626;

      color: #fff;

    }


    /*
    ========================================
    INFORMAÇÕES DA MÚSICA
    ========================================
    */

    .song-info {

      flex: 1;

      min-width: 0;

    }


    .song-title {

      font-size: 18px;

      font-weight: bold;

      line-height: 1.2;

    }


    .artist {

      margin-top: 5px;

      font-size: 13px;

      color: #777;

    }


    body.manowar-mode
    .artist {

      color: #887f69;

    }


    .duration {

      font-family: monospace;

      font-size: 16px;

      color: #bbb;

      flex-shrink: 0;

    }


    /*
    ========================================
    RODAPÉ
    ========================================
    */

    footer {

      max-width: 1050px;

      margin:
        0 auto 40px;

      padding:
        0 20px;

      color: #555;

      font-size: 12px;

      text-align: center;

    }


    /*
    ========================================
    MOBILE
    ========================================
    */

    @media
    (max-width: 650px) {

      header {

        position: relative;

      }


      .top {

        display: block;

      }


      .brand img {

        width: 285px;

      }


      .counter {

        text-align: left;

        margin-top: 22px;

      }


      #totalTime {

        font-size: 30px;

      }


      .mode-buttons {

        grid-template-columns: 1fr;

      }


      .buttons {

        flex-direction: column;

      }


      .section-header {

        display: block;

      }


      .section-hint {

        text-align: left;

        margin-top: 7px;

      }


      .song {

        gap: 10px;

        padding: 14px;

      }


      .song-title {

        font-size: 16px;

      }


      .artist {

        font-size: 12px;

      }


      .order-badge {

        width: 29px;

        height: 29px;

        font-size: 13px;

      }


      .duration {

        font-size: 14px;

      }


      body.manowar-mode::before {

        background-position:
          center top;

      }

    }

  </style>

</head>

/*
========================================
ESTADO DO SISTEMA
========================================
*/

let currentMode =
  "covers";


const selectionState = {

  covers: [],

  manowar: []

};



/*
========================================
RETORNA O REPERTÓRIO ATUAL
========================================
*/

function getCurrentSongs() {

  if (
    currentMode ===
    "manowar"
  ) {

    return manowarSongs;

  }


  return coversSongs;

}



function getCurrentSelection() {

  return selectionState[
    currentMode
  ];

}



/*
========================================
CONVERSÃO DE TEMPO
========================================
*/

function timeToSeconds(time) {

  const parts =
    time.split(":");


  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}



/*
========================================
FORMATAÇÃO DO TEMPO
========================================
*/

function formatTime(
  totalSeconds
) {

  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (
        totalSeconds %
        3600
      ) / 60
    );


  const seconds =
    totalSeconds % 60;


  return (
    hours +
    "h " +
    String(minutes)
      .padStart(
        2,
        "0"
      ) +
    "m " +
    String(seconds)
      .padStart(
        2,
        "0"
      ) +
    "s"
  );

}



/*
========================================
TROCA DE REPERTÓRIO
========================================
*/

function switchMode(mode) {

  currentMode = mode;


  const coversButton =
    document.getElementById(
      "coversModeButton"
    );


  const manowarButton =
    document.getElementById(
      "manowarModeButton"
    );


  const subtitle =
    document.getElementById(
      "modeSubtitle"
    );


  const sectionTitle =
    document.getElementById(
      "sectionTitle"
    );


  coversButton.classList
    .remove("active");


  manowarButton.classList
    .remove("active");


  if (
    mode ===
    "manowar"
  ) {

    document.body
      .classList
      .add(
        "manowar-mode"
      );


    manowarButton
      .classList
      .add("active");


    subtitle.textContent =
      "Setlist Builder • Plays Manowar";


    sectionTitle.textContent =
      "OLDSKÜLL PLAYS MANOWAR";

  }


  else {

    document.body
      .classList
      .remove(
        "manowar-mode"
      );


    coversButton
      .classList
      .add("active");


    subtitle.textContent =
      "Setlist Builder • Covers";


    sectionTitle.textContent =
      "OLDSKÜLL — COVERS";

  }


  renderSongs();

  updateTotal();

}



/*
========================================
CRIA A LISTA DE MÚSICAS
========================================
*/

function renderSongs() {

  const songs =
    getCurrentSongs();


  const selection =
    getCurrentSelection();


  const list =
    document.getElementById(
      "songList"
    );


  list.innerHTML = "";


  songs.forEach(
    (
      song,
      index
    ) => {


      const item =
        document.createElement(
          "label"
        );


      item.className =
        "song";


      const isSelected =
        selection.includes(
          index
        );


      const position =
        selection.indexOf(
          index
        );


      if (isSelected) {

        item.classList
          .add(
            "selected"
          );

      }


      item.innerHTML = `

        <input
          type="checkbox"

          data-index="${index}"

          ${
            isSelected
              ? "checked"
              : ""
          }

          onchange="handleSelection(this)"
        >


        <span
          class="order-badge
          ${
            isSelected
              ? "active"
              : ""
          }"

          data-order="${index}"
        >

          ${
            isSelected
              ? position + 1
              : ""
          }

        </span>


        <div
          class="song-info"
        >

          <div
            class="song-title"
          >

            ${song.title}

          </div>


          <div
            class="artist"
          >

            ${song.artist}

          </div>

        </div>


        <div
          class="duration"
        >

          ${song.duration}

        </div>

      `;


      list.appendChild(
        item
      );

    }
  );

}



/*
========================================
SELEÇÃO DAS MÚSICAS
========================================
*/

function handleSelection(box) {

  const index =
    Number(
      box.dataset.index
    );


  let selection =
    getCurrentSelection();


  if (box.checked) {

    if (
      !selection.includes(
        index
      )
    ) {

      selection.push(index);

    }

  }


  else {

    selection =
      selection.filter(
        item =>
          item !== index
      );


    selectionState[
      currentMode
    ] = selection;

  }


  renderSongs();

  updateTotal();

}



/*
========================================
ATUALIZA CONTADOR E TEMPO
========================================
*/

function updateTotal() {

  const songs =
    getCurrentSongs();


  const selection =
    getCurrentSelection();


  let totalSeconds = 0;


  selection.forEach(
    index => {

      totalSeconds +=
        timeToSeconds(
          songs[index]
            .duration
        );

    }
  );


  document
    .getElementById(
      "trackCount"
    )
    .textContent =

      selection.length +

      " DE " +

      songs.length +

      " FAIXAS";


  document
    .getElementById(
      "totalTime"
    )
    .textContent =

      formatTime(
        totalSeconds
      );

}

========================================
*/

function clearSetlist() {

  selectionState[
    currentMode
  ] = [];


  renderSongs();

  updateTotal();

}



/*
========================================
COPIAR SETLIST
========================================
*/

function copySetlist() {

  const songs =
    getCurrentSongs();


  const selection =
    getCurrentSelection();


  if (
    selection.length === 0
  ) {

    alert(
      "Selecione pelo menos uma música."
    );


    return;

  }



  let totalSeconds = 0;


  let text = "";


  if (
    currentMode ===
    "manowar"
  ) {

    text +=
      "OLDSKÜLL PLAYS MANOWAR\n\n";

  }


  else {

    text +=
      "OLDSKÜLL — SETLIST\n\n";

  }



  selection.forEach(
    (
      songIndex,
      position
    ) => {


      const song =
        songs[
          songIndex
        ];


      text +=

        (
          position + 1
        ) +

        ". " +

        song.title +

        " — " +

        song.duration +

        "\n";


      totalSeconds +=

        timeToSeconds(
          song.duration
        );

    }
  );



  text +=

    "\nTEMPO TOTAL: " +

    formatTime(
      totalSeconds
    );



  navigator
    .clipboard
    .writeText(text)

    .then(() => {


      const button =

        document
          .getElementById(
            "copyButton"
          );


      const originalText =

        button
          .textContent;


      button.textContent =

        "✓ Setlist copiado!";


      setTimeout(
        () => {

          button
            .textContent =

              originalText;

        },

        1500

      );

    })


    .catch(() => {

      alert(
        "Não foi possível copiar automaticamente."
      );

    });

}



/*
========================================
INICIALIZAÇÃO
========================================
*/

switchMode(
  "covers"
);



</script>
