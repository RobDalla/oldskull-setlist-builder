<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oldsküll Setlist Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #f2f2f2;
    }

    header {
      background: #111;
      border-bottom: 1px solid #444;
      padding: 25px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 950px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand img {
      width: 320px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .brand p {
      margin: 12px 0 0;
      color: #999;
    }

    .counter {
      text-align: right;
    }

    #trackCount {
      color: #aaa;
      font-weight: bold;
      font-size: 14px;
    }

    #totalTime {
      font-size: 34px;
      font-weight: bold;
      margin-top: 4px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #1b1b1b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #292929;
    }

    #copyButton {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    #copyButton:hover {
      background: white;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .section-title {
      color: #888;
      font-size: 13px;
      letter-spacing: 2px;
      margin: 5px 0 18px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .song:hover {
      border-color: #666;
      transform: translateY(-1px);
    }

    .song.selected {
      border-color: #777;
      background: #181818;
    }

    .song input {
      width: 22px;
      height: 22px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .order-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

      font-size: 15px;
      font-weight: bold;

      background: #222;
      border: 1px solid #444;
      color: #777;

      opacity: 0;
      transition: 0.2s;
    }

    .order-badge.active {
      opacity: 1;
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    .song-title {
      flex: 1;
      font-size: 18px;
      font-weight: bold;
    }

    .duration {
      font-family: monospace;
      font-size: 16px;
      color: #bbb;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {

      header {
        position: relative;
      }

      .top {
        display: block;
      }

      .brand img {
        width: 280px;
      }

      .counter {
        text-align: left;
        margin-top: 20px;
      }

      #totalTime {
        font-size: 30px;
      }

      .buttons {
        flex-direction: column;
      }

      .song {
        gap: 10px;
        padding: 15px;
      }

      .song-title {
        font-size: 16px;
      }

      .order-badge {
        width: 30px;
        height: 30px;
        font-size: 13px;
      }

      .duration {
        font-size: 14px;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="header-content">

    <div class="top">

      <div class="brand">

        <img
          src="oldskull-logo.png"
          alt="Oldsküll Heavy Metal Tribute Band"
        >

        <p>Setlist Builder • Manowar Tribute</p>

      </div>


      <div class="counter">

        <div id="trackCount">
          0 DE 17 FAIXAS
        </div>

        <div id="totalTime">
          0h 00m 00s
        </div>

      </div>

    </div>


    <div class="buttons">

      <button onclick="clearSetlist()">
        🗑 Limpar
      </button>

      <button
        id="copyButton"
        onclick="copySetlist()"
      >
        📋 Copiar Setlist
      </button>

    </div>

  </div>

</header>


<main>

  <div class="section-title">
    OLDSKÜLL — MANOWAR SETLIST
  </div>

  <div id="songList"></div>

</main>


<script>

const songs = [

  {
    title: "Fighting the World",
    duration: "3:51"
  },

  {
    title: "The Gods Made Heavy Metal",
    duration: "6:04"
  },

  {
    title: "Kings of Metal",
    duration: "3:44"
  },

  {
    title: "Kingdom Come",
    duration: "3:57"
  },

  {
    title: "Wheels of Fire",
    duration: "4:11"
  },

  {
    title: "Battle Hymn",
    duration: "6:59"
  },

  {
    title: "Brothers of Metal (Part 1)",
    duration: "3:55"
  },

  {
    title: "Metal Warriors",
    duration: "3:55"
  },

  {
    title: "Hail and Kill",
    duration: "5:58"
  },

  {
    title: "Heart of Steel",
    duration: "5:11"
  },

  {
    title: "Holy War",
    duration: "4:45"
  },

  {
    title: "Carry On",
    duration: "4:13"
  },

  {
    title: "Kill with Power",
    duration: "3:58"
  },

  {
    title: "Blood of the Kings",
    duration: "7:30"
  },

  {
    title: "Blood of My Enemies",
    duration: "4:16"
  },

  {
    title: "Manowar",
    duration: "3:37"
  },

  {
    title: "Black Wind, Fire and Steel",
    duration: "5:16"
  }

];


let selectionOrder = [];


/* ================================
   CONVERSÃO DE TEMPO
================================ */

function timeToSeconds(time) {

  const parts = time.split(":");

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


/* ================================
   FORMATAÇÃO DO TEMPO
================================ */

function formatTime(totalSeconds) {

  const hours =
    Math.floor(totalSeconds / 3600);

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;


  return (
    hours +
    "h " +
    String(minutes).padStart(2, "0") +
    "m " +
    String(seconds).padStart(2, "0") +
    "s"
  );

}


/* ================================
   CRIAÇÃO DA LISTA DE MÚSICAS
================================ */

function renderSongs() {

  const list =
    document.getElementById("songList");


  list.innerHTML = "";


  songs.forEach((song, index) => {

    const item =
      document.createElement("label");


    item.className = "song";


    item.innerHTML = `

      <input
        type="checkbox"
        data-index="${index}"
        onchange="handleSelection(this)"
      >

      <span
        class="order-badge"
        data-order="${index}"
      ></span>

      <span class="song-title">
        ${song.title}
      </span>

      <span class="duration">
        ${song.duration}
      </span>

    `;


    list.appendChild(item);

  });

}


/* ================================
   CLIQUE / ORDEM DO SETLIST
================================ */

function handleSelection(box) {

  const index =
    Number(box.dataset.index);


  if (box.checked) {

    if (!selectionOrder.includes(index)) {

      selectionOrder.push(index);

    }

  } else {

    selectionOrder =
      selectionOrder.filter(
        item => item !== index
      );

  }


  updateSelectionNumbers();

  updateTotal();

}


/* ================================
   NUMERAÇÃO VISUAL
================================ */

function updateSelectionNumbers() {

  const badges =
    document.querySelectorAll(
      ".order-badge"
    );


  badges.forEach(badge => {

    badge.textContent = "";

    badge.classList.remove("active");

  });


  selectionOrder.forEach(
    (songIndex, position) => {

      const badge =
        document.querySelector(
          `[data-order="${songIndex}"]`
        );


      if (badge) {

        badge.textContent =
          position + 1;

        badge.classList.add("active");

      }

    }
  );

}


/* ================================
   CÁLCULO DO TEMPO TOTAL
================================ */

function updateTotal() {

  const checkboxes =
    document.querySelectorAll(
      'input[type="checkbox"]'
    );


  let totalSeconds = 0;

  let selectedCount = 0;


  checkboxes.forEach(box => {

    const songIndex =
      Number(box.dataset.index);

    const song =
      songs[songIndex];

    const row =
      box.closest(".song");


    if (box.checked) {

      selectedCount++;

      totalSeconds +=
        timeToSeconds(song.duration);

      row.classList.add("selected");

    } else {

      row.classList.remove("selected");

    }

  });


  document
    .getElementById("trackCount")
    .textContent =
      selectedCount +
      " DE " +
      songs.length +
      " FAIXAS";


  document
    .getElementById("totalTime")
    .textContent =
      formatTime(totalSeconds);

}


/* ================================
   LIMPAR SETLIST
================================ */

function clearSetlist() {

  const checkboxes =
    document.querySelectorAll(
      'input[type="checkbox"]'
    );


  checkboxes.forEach(box => {

    box.checked = false;

  });


  selectionOrder = [];


  updateSelectionNumbers();

  updateTotal();

}


/* ================================
   COPIAR SETLIST
================================ */

function copySetlist() {

  if (selectionOrder.length === 0) {

    alert(
      "Selecione pelo menos uma música."
    );

    return;

  }


  const selectedSongs =
    selectionOrder.map(
      index => songs[index]
    );


  let totalSeconds = 0;


  selectedSongs.forEach(song => {

    totalSeconds +=
      timeToSeconds(song.duration);

  });


  let text =
    "OLDSKÜLL — SETLIST\n\n";


  selectedSongs.forEach(
    (song, index) => {

      text +=
        (index + 1) +
        ". " +
        song.title +
        " — " +
        song.duration +
        "\n";

    }
  );


  text +=
    "\nTEMPO TOTAL: " +
    formatTime(totalSeconds);


  navigator.clipboard
    .writeText(text)
    .then(() => {

      const button =
        document.getElementById(
          "copyButton"
        );


      const originalText =
        button.textContent;


      button.textContent =
        "✓ Setlist copiado!";


      setTimeout(() => {

        button.textContent =
          originalText;

      }, 1500);

    })
    .catch(() => {

      alert(
        "Não foi possível copiar automaticamente."
      );

    });

}


/* ================================
   INICIALIZAÇÃO
================================ */

renderSongs();

updateTotal();

</script>

</body>

</html>
