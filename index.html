<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oldsküll Setlist Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #f2f2f2;
    }

    header {
      background: #111;
      border-bottom: 1px solid #444;
      padding: 25px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 950px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #999;
    }

    .counter {
      text-align: right;
    }

    #trackCount {
      color: #aaa;
      font-weight: bold;
      font-size: 14px;
    }

    #totalTime {
      font-size: 34px;
      font-weight: bold;
      margin-top: 4px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #1b1b1b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #292929;
    }

    #copyButton {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    #copyButton:hover {
      background: white;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .song:hover {
      border-color: #666;
      transform: translateY(-1px);
    }

    .song.selected {
      border-color: #aaa;
      background: #181818;
    }

    .song input {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .song-title {
      flex: 1;
      font-size: 18px;
      font-weight: bold;
    }

    .duration {
      font-family: monospace;
      font-size: 16px;
      color: #bbb;
    }

    .section-title {
      color: #888;
      font-size: 13px;
      letter-spacing: 2px;
      margin: 5px 0 18px;
    }

    @media (max-width: 600px) {
      .top {
        display: block;
      }

      .counter {
        text-align: left;
        margin-top: 20px;
      }

      #totalTime {
        font-size: 30px;
      }

      .buttons {
        flex-direction: column;
      }

      .song-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">

    <div class="top">

      <div class="brand">
        <h1>OLDSKÜLL</h1>
        <p>Setlist Builder • Manowar Tribute</p>
      </div>

      <div class="counter">
        <div id="trackCount">0 DE 17 FAIXAS</div>
        <div id="totalTime">0h 00m 00s</div>
      </div>

    </div>

    <div class="buttons">
      <button onclick="clearSetlist()">🗑 Limpar</button>
      <button id="copyButton" onclick="copySetlist()">📋 Copiar Setlist</button>
    </div>

  </div>
</header>


<main>

  <div class="section-title">OLDSKÜLL — MANOWAR SETLIST</div>

  <div id="songList"></div>

</main>


<script>

const songs = [
  { title: "Fighting the World", duration: "3:51" },
  { title: "The Gods Made Heavy Metal", duration: "6:04" },
  { title: "Kings of Metal", duration: "3:44" },
  { title: "Kingdom Come", duration: "3:57" },
  { title: "Wheels of Fire", duration: "4:11" },
  { title: "Battle Hymn", duration: "6:59" },
  { title: "Brothers of Metal (Part 1)", duration: "3:55" },
  { title: "Metal Warriors", duration: "3:55" },
  { title: "Hail and Kill", duration: "5:58" },
  { title: "Heart of Steel", duration: "5:11" },
  { title: "Holy War", duration: "4:45" },
  { title: "Carry On", duration: "4:13" },
  { title: "Kill with Power", duration: "3:58" },
  { title: "Blood of the Kings", duration: "7:30" },
  { title: "Blood of My Enemies", duration: "4:16" },
  { title: "Manowar", duration: "3:37" },
  { title: "Black Wind, Fire and Steel", duration: "5:16" }
];


function timeToSeconds(time) {
  const parts = time.split(":");
  return Number(parts[0]) * 60 + Number(parts[1]);
}


function formatTime(totalSeconds) {

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  return (
    hours + "h " +
    String(minutes).padStart(2, "0") + "m " +
    String(seconds).padStart(2, "0") + "s"
  );
}


function renderSongs() {

  const list = document.getElementById("songList");

  songs.forEach((song, index) => {

    const item = document.createElement("label");

    item.className = "song";

    item.innerHTML = `
      <input
        type="checkbox"
        data-index="${index}"
        onchange="updateTotal()"
      >

      <span class="song-title">
        ${song.title}
      </span>

      <span class="duration">
        ${song.duration}
      </span>
    `;

    list.appendChild(item);

  });

}


function updateTotal() {

  const checkboxes =
    document.querySelectorAll('input[type="checkbox"]');

  let totalSeconds = 0;
  let selectedCount = 0;

  checkboxes.forEach(box => {

    const song =
      songs[Number(box.dataset.index)];

    const row = box.closest(".song");

    if (box.checked) {

      selectedCount++;

      totalSeconds +=
        timeToSeconds(song.duration);

      row.classList.add("selected");

    } else {

      row.classList.remove("selected");

    }

  });


  document.getElementById("trackCount").textContent =
    selectedCount +
    " DE " +
    songs.length +
    " FAIXAS";


  document.getElementById("totalTime").textContent =
    formatTime(totalSeconds);

}


function clearSetlist() {

  const checkboxes =
    document.querySelectorAll('input[type="checkbox"]');

  checkboxes.forEach(box => {
    box.checked = false;
  });

  updateTotal();

}


function copySetlist() {

  const checkboxes =
    document.querySelectorAll('input[type="checkbox"]');

  const selectedSongs = [];

  let totalSeconds = 0;


  checkboxes.forEach(box => {

    if (box.checked) {

      const song =
        songs[Number(box.dataset.index)];

      selectedSongs.push(song);

      totalSeconds +=
        timeToSeconds(song.duration);

    }

  });


  if (selectedSongs.length === 0) {

    alert("Selecione pelo menos uma música.");

    return;

  }


  let text =
    "OLDSKÜLL — SETLIST\n\n";


  selectedSongs.forEach((song, index) => {

    text +=
      (index + 1) +
      ". " +
      song.title +
      " — " +
      song.duration +
      "\n";

  });


  text +=
    "\nTEMPO TOTAL: " +
    formatTime(totalSeconds);


  navigator.clipboard.writeText(text)
    .then(() => {

      const button =
        document.getElementById("copyButton");

      const originalText =
        button.textContent;

      button.textContent =
        "✓ Setlist copiado!";

      setTimeout(() => {

        button.textContent =
          originalText;

      }, 1500);

    });

}


renderSongs();

</script>

</body>
</html>
