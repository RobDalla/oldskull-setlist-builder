
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oldsküll Setlist Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #f2f2f2;
      min-height: 100vh;
    }

    /* FUNDO MANOWAR */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
      opacity: 0;
    }

    body.manowar-mode::before {
      opacity: 1;
      background-image:
        linear-gradient(
          rgba(0, 0, 0, .84),
          rgba(0, 0, 0, .94)
        ),
        url("oldskull-manowar.jpeg");
    }

    /* CABEÇALHO */

    header {
      background: rgba(17, 17, 17, .97);
      border-bottom: 1px solid #444;
      padding: 24px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-content,
    main {
      max-width: 1050px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .brand img {
      width: 320px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .brand p {
      margin: 12px 0 0;
      color: #999;
      font-size: 15px;
    }

    .counter {
      text-align: right;
    }

    #trackCount {
      color: #aaa;
      font-weight: bold;
      font-size: 14px;
    }

    #totalTime {
      font-size: 36px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* SELETOR DE REPERTÓRIO */

    .mode-area {
      margin-top: 22px;
    }

    .mode-label {
      color: #888;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: .2s;
    }

    .mode-button {
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #171717;
      color: #aaa;
    }

    .mode-button:hover {
      border-color: #777;
      color: white;
    }

    .mode-button.active {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    body.manowar-mode #manowarModeButton.active {
      background: #800b0b;
      color: white;
      border-color: #b82020;
    }

    /* BOTÕES PRINCIPAIS */

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .action-button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #1b1b1b;
      color: white;
      font-size: 15px;
    }

    .action-button:hover {
      background: #333;
    }

    #copyButton {
      background: #eee;
      color: #111;
    }

    #copyButton:hover {
      background: white;
    }

    body.manowar-mode #copyButton {
      background: #800b0b;
      color: white;
    }

    /* CONTEÚDO */

    main {
      padding: 28px 20px 70px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section-title {
      color: #999;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    body.manowar-mode .section-title {
      color: #c9b36e;
    }

    .section-hint {
      color: #777;
      font-size: 12px;
    }

    /* MÚSICAS NA TELA */

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(17, 17, 17, .95);
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 11px;
      cursor: pointer;
      transition: .2s;
    }

    .song:hover {
      border-color: #777;
    }

    .song.selected {
      background: rgba(35, 35, 35, .97);
      border-color: #888;
    }

    body.manowar-mode .song.selected {
      background: rgba(48, 15, 15, .95);
      border-color: #9b3030;
    }

    .song input {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      accent-color: #ddd;
      cursor: pointer;
    }

    body.manowar-mode .song input {
      accent-color: #a30f0f;
    }

    .order-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: bold;
      background: #eee;
      color: #111;
      visibility: hidden;
    }

    .order-badge.active {
      visibility: visible;
    }

    body.manowar-mode .order-badge.active {
      background: #a31313;
      color: white;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
    }

    .artist {
      margin-top: 5px;
      color: #888;
      font-size: 13px;
    }

    .duration {
      font-family: monospace;
      font-size: 16px;
      color: #bbb;
      flex-shrink: 0;
    }

    footer {
      color: #666;
      text-align: center;
      font-size: 12px;
      padding: 0 20px 35px;
    }

    /* ÁREA EXCLUSIVA DE IMPRESSÃO */

    #printArea {
      display: none;
    }

    /* CELULAR */

    @media (max-width: 650px) {
      header {
        position: relative;
      }

      .top {
        display: block;
      }

      .brand img {
        width: 285px;
      }

      .counter {
        text-align: left;
        margin-top: 22px;
      }

      #totalTime {
        font-size: 30px;
      }

      .mode-buttons {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      .section-header {
        display: block;
      }

      .section-hint {
        margin-top: 8px;
      }

      .song {
        gap: 10px;
        padding: 14px;
      }

      .song-title {
        font-size: 16px;
      }

      .order-badge {
        width: 29px;
        height: 29px;
      }

      .duration {
        font-size: 14px;
      }
    }

    /*
    ========================================
    IMPRESSÃO PROFISSIONAL A4
    ========================================
    */

    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm;
      }

      html,
      body {
        background: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      body::before,
      header,
      main,
      footer {
        display: none !important;
      }

      #printArea {
        display: block !important;
        width: 100%;
        color: black;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* LOGOTIPO */

      .print-logo {
        display: block;
        width: auto;
        max-width: 85%;
        max-height: 100px;
        height: auto;
        object-fit: contain;
        margin: 0 auto 12px;
      }

      /* TÍTULO */

      .print-title {
        text-align: center;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 24px;
      }

      /* CABEÇALHO DA LISTA */

      .print-list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #111;
        padding: 0 5px 9px;
        margin-bottom: 4px;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      /* CADA MÚSICA */

      .print-song {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 65px;
        align-items: center;
        column-gap: 10px;
        padding: 9px 5px;
        border-bottom: 1px solid #ddd;
        font-size: 13px;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* NUMERAÇÃO */

      .print-number {
        font-size: 13px;
        font-weight: bold;
        text-align: right;
        white-space: nowrap;
      }

      /* NOME DA MÚSICA */

      .print-song-name {
        font-size: 14px;
        font-weight: bold;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      /* DURAÇÃO */

      .print-duration {
        font-family: Arial, sans-serif;
        font-size: 13px;
        text-align: right;
        white-space: nowrap;
        font-weight: bold;
      }

      /* TEMPO TOTAL */

      .print-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
        padding: 15px 5px 0;
        border-top: 2px solid black;
        font-size: 17px;
        font-weight: bold;
        break-inside: avoid;
      }

      .print-total-time {
        font-size: 20px;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">

      <div class="top">
        <div class="brand">
          <img
            src="oldskull-logo.png"
            alt="Oldsküll Heavy Metal Tribute Band"
          >
          <p id="modeSubtitle">
            Setlist Builder • Covers
          </p>
        </div>

        <div class="counter">
          <div id="trackCount">0 DE 26 FAIXAS</div>
          <div id="totalTime">0h 00m 00s</div>
        </div>
      </div>

      <div class="mode-area">
        <div class="mode-label">
          ESCOLHA O REPERTÓRIO
        </div>

        <div class="mode-buttons">
          <button
            id="coversModeButton"
            class="mode-button active"
            onclick="switchMode('covers')"
          >
            🎸 OLDSKÜLL — COVERS
          </button>

          <button
            id="manowarModeButton"
            class="mode-button"
            onclick="switchMode('manowar')"
          >
            ⚔️ OLDSKÜLL PLAYS MANOWAR
          </button>
        </div>
      </div>

      <div class="buttons">
        <button
          class="action-button"
          onclick="clearSetlist()"
        >
          🗑 Limpar
        </button>

        <button
          id="copyButton"
          class="action-button"
          onclick="copySetlist()"
        >
          📋 Copiar Setlist
        </button>

        <button
          class="action-button"
          onclick="printSetlist()"
        >
          🖨 Imprimir Setlist
        </button>
      </div>

    </div>
  </header>

  <main>
    <div class="section-header">
      <div id="sectionTitle" class="section-title">
        OLDSKÜLL — COVERS
      </div>

      <div class="section-hint">
        Selecione na ordem em que deseja tocar.
      </div>
    </div>

    <div id="songList"></div>
  </main>

  <footer>
    Oldsküll Setlist Builder • A ordem é definida pelos cliques
  </footer>

  <!-- ÁREA EXCLUSIVA PARA IMPRESSÃO -->

  <div id="printArea">

    <img
      id="printLogo"
      class="print-logo"
      alt="Logotipo da banda"
    >

    <div
      id="printTitle"
      class="print-title"
    ></div>

    <div class="print-list-header">
      <span>MÚSICA</span>
      <span>DURAÇÃO</span>
    </div>

    <div id="printSongs"></div>

    <div id="printTotal" class="print-total">
      <span>TEMPO TOTAL</span>
      <span id="printTotalTime" class="print-total-time"></span>
    </div>

  </div>

  <script>

    /*
    ========================================
    REPERTÓRIO OLDSKÜLL — COVERS
    ========================================
    */

    const coversSongs = [
      {title:"The Hellion / Electric Eye",artist:"Judas Priest",duration:"4:21"},
      {title:"Bark at the Moon",artist:"Ozzy Osbourne",duration:"4:18"},
      {title:"Children of the Grave",artist:"Black Sabbath / Ozzy Osbourne",duration:"5:59"},
      {title:"Caught Somewhere in Time",artist:"Iron Maiden",duration:"7:28"},
      {title:"Eagle Fly Free",artist:"Helloween",duration:"5:09"},
      {title:"March of Time",artist:"Helloween",duration:"5:16"},
      {title:"Queen of the Reich",artist:"Queensrÿche",duration:"4:25"},
      {title:"Battle Hymn",artist:"Manowar",duration:"6:57"},
      {title:"Hail and Kill",artist:"Manowar",duration:"5:58"},
      {title:"Thundersteel",artist:"Riot",duration:"3:51"},
      {title:"Battle Angels",artist:"Sanctuary",duration:"4:52"},
      {title:"Killers",artist:"Iron Maiden",duration:"5:02"},
      {title:"Painkiller",artist:"Judas Priest",duration:"6:06"},
      {title:"Egypt",artist:"Mercyful Fate",duration:"4:53"},
      {title:"A Mansion in Darkness",artist:"King Diamond",duration:"4:35"},
      {title:"Dead Skin Mask",artist:"Slayer",duration:"5:21"},
      {title:"Holy Wars... The Punishment Due",artist:"Megadeth",duration:"6:33"},
      {title:"Master of Puppets",artist:"Metallica",duration:"8:36"},
      {title:"Slave to the Grind",artist:"Skid Row",duration:"3:29"},
      {title:"Nightrain",artist:"Guns N' Roses",duration:"5:19"},
      {title:"It's So Easy",artist:"Guns N' Roses",duration:"3:23"},
      {title:"Wild Child",artist:"W.A.S.P.",duration:"5:13"},
      {title:"L.O.V.E. Machine",artist:"W.A.S.P.",duration:"3:52"},
      {title:"Killed by Death",artist:"Motörhead",duration:"4:39"},
      {title:"Overkill",artist:"Motörhead",duration:"5:14"},
      {title:"N.I.B.",artist:"Black Sabbath",duration:"6:07"}
    ];

    /*
    ========================================
    REPERTÓRIO OLDSKÜLL PLAYS MANOWAR
    ========================================
    */

    const manowarSongs = [
      {title:"Fighting the World",artist:"Manowar",duration:"3:51"},
      {title:"The Gods Made Heavy Metal",artist:"Manowar",duration:"6:04"},
      {title:"Kings of Metal",artist:"Manowar",duration:"3:44"},
      {title:"Kingdom Come",artist:"Manowar",duration:"3:57"},
      {title:"Wheels of Fire",artist:"Manowar",duration:"4:11"},
      {title:"Battle Hymn",artist:"Manowar",duration:"6:59"},
      {title:"Brothers of Metal (Part 1)",artist:"Manowar",duration:"3:55"},
      {title:"Metal Warriors",artist:"Manowar",duration:"3:55"},
      {title:"Hail and Kill",artist:"Manowar",duration:"5:58"},
      {title:"Heart of Steel",artist:"Manowar",duration:"5:11"},
      {title:"Holy War",artist:"Manowar",duration:"4:45"},
      {title:"Carry On",artist:"Manowar",duration:"4:13"},
      {title:"Kill with Power",artist:"Manowar",duration:"3:58"},
      {title:"Blood of the Kings",artist:"Manowar",duration:"7:30"},
      {title:"Blood of My Enemies",artist:"Manowar",duration:"4:16"},
      {title:"Manowar",artist:"Manowar",duration:"3:37"},
      {title:"Black Wind, Fire and Steel",artist:"Manowar",duration:"5:16"},
      {title:"The Power of Thy Sword",artist:"Manowar",duration:"7:49"}
    ];

    /*
    ========================================
    ESTADO DOS DOIS REPERTÓRIOS
    ========================================
    */

    let currentMode = "covers";

    const selectionState = {
      covers: [],
      manowar: []
    };

    function getCurrentSongs() {
      return currentMode === "manowar"
        ? manowarSongs
        : coversSongs;
    }

    function getCurrentSelection() {
      return selectionState[currentMode];
    }

    /*
    ========================================
    TEMPO
    ========================================
    */

    function timeToSeconds(time) {
      const [minutes, seconds] = time.split(":").map(Number);
      return minutes * 60 + seconds;
    }

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return (
        hours + "h " +
        String(minutes).padStart(2, "0") + "m " +
        String(seconds).padStart(2, "0") + "s"
      );
    }

    function getSelectedSongs() {
      const songs = getCurrentSongs();
      return getCurrentSelection().map(index => songs[index]);
    }

    function getTotalSeconds(selectedSongs) {
      return selectedSongs.reduce(
        (total, song) => total + timeToSeconds(song.duration),
        0
      );
    }

    function getSetlistTitle() {
      return currentMode === "manowar"
        ? "OLDSKÜLL PLAYS MANOWAR"
        : "OLDSKÜLL — SETLIST";
    }

    /*
    ========================================
    TROCAR REPERTÓRIO
    ========================================
    */

    function switchMode(mode) {
      if (!["covers", "manowar"].includes(mode)) return;

      currentMode = mode;

      const isManowar = mode === "manowar";

      document.body.classList.toggle("manowar-mode", isManowar);

      document.getElementById("coversModeButton")
        .classList.toggle("active", !isManowar);

      document.getElementById("manowarModeButton")
        .classList.toggle("active", isManowar);

      document.getElementById("modeSubtitle").textContent =
        isManowar
          ? "Setlist Builder • Plays Manowar"
          : "Setlist Builder • Covers";

      document.getElementById("sectionTitle").textContent =
        isManowar
          ? "OLDSKÜLL PLAYS MANOWAR"
          : "OLDSKÜLL — COVERS";

      renderSongs();
      updateTotal();
    }

    /*
    ========================================
    RENDERIZAR MÚSICAS
    ========================================
    */

    function renderSongs() {
      const songs = getCurrentSongs();
      const selection = getCurrentSelection();
      const list = document.getElementById("songList");

      list.innerHTML = "";

      songs.forEach((song, index) => {
        const item = document.createElement("label");
        const position = selection.indexOf(index);
        const selected = position !== -1;

        item.className = selected ? "song selected" : "song";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selected;
        checkbox.dataset.index = index;

        checkbox.addEventListener(
          "change",
          () => handleSelection(checkbox)
        );

        const badge = document.createElement("span");
        badge.className = selected
          ? "order-badge active"
          : "order-badge";

        badge.textContent = selected ? position + 1 : "";

        const info = document.createElement("span");
        info.className = "song-info";

        const title = document.createElement("div");
        title.className = "song-title";
        title.textContent = song.title;

        const artist = document.createElement("div");
        artist.className = "artist";
        artist.textContent = song.artist;

        info.append(title, artist);

        const duration = document.createElement("span");
        duration.className = "duration";
        duration.textContent = song.duration;

        item.append(checkbox, badge, info, duration);
        list.appendChild(item);
      });
    }

    /*
    ========================================
    SELEÇÃO NA ORDEM DOS CLIQUES
    ========================================
    */

    function handleSelection(checkbox) {
      const index = Number(checkbox.dataset.index);
      const selection = getCurrentSelection();

      if (checkbox.checked) {
        if (!selection.includes(index)) {
          selection.push(index);
        }
      } else {
        const position = selection.indexOf(index);

        if (position !== -1) {
          selection.splice(position, 1);
        }
      }

      renderSongs();
      updateTotal();
    }

    /*
    ========================================
    ATUALIZAR CONTADOR
    ========================================
    */

    function updateTotal() {
      const selectedSongs = getSelectedSongs();

      document.getElementById("trackCount").textContent =
        selectedSongs.length + " DE " +
        getCurrentSongs().length + " FAIXAS";

      document.getElementById("totalTime").textContent =
        formatTime(getTotalSeconds(selectedSongs));
    }

    /*
    ========================================
    LIMPAR SETLIST ATUAL
    ========================================
    */

    function clearSetlist() {
      selectionState[currentMode] = [];
      renderSongs();
      updateTotal();
    }

    /*
    ========================================
    COPIAR SETLIST
    ========================================
    */

    async function copySetlist() {
      const selectedSongs = getSelectedSongs();

      if (!selectedSongs.length) {
        alert("Selecione pelo menos uma música.");
        return;
      }

      let text = getSetlistTitle() + "\n\n";

      selectedSongs.forEach((song, index) => {
        text +=
          (index + 1) + ". " +
          song.title + " — " +
          song.duration + "\n";
      });

      text += "\nTEMPO TOTAL: " +
        formatTime(getTotalSeconds(selectedSongs));

      try {
        await navigator.clipboard.writeText(text);

        const button = document.getElementById("copyButton");
        button.textContent = "✓ Setlist copiado!";

        setTimeout(() => {
          button.textContent = "📋 Copiar Setlist";
        }, 1800);

      } catch (error) {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";

        document.body.appendChild(area);
        area.select();

        const copied = document.execCommand("copy");
        area.remove();

        if (copied) {
          alert("Setlist copiado!");
        } else {
          alert("Não foi possível copiar automaticamente.");
        }
      }
    }

    /*
    ========================================
    IMPRESSÃO PROFISSIONAL
    ========================================
    */

    function printSetlist() {
      const selectedSongs = getSelectedSongs();

      if (!selectedSongs.length) {
        alert("Selecione pelo menos uma música antes de imprimir.");
        return;
      }

      const logo = document.getElementById("printLogo");

      const logoFile = currentMode === "manowar"
        ? "oldskull-plays-manowar.png"
        : "oldskull-logo.png";

      document.getElementById("printTitle").textContent =
        getSetlistTitle();

      const container = document.getElementById("printSongs");
      container.innerHTML = "";

      selectedSongs.forEach((song, index) => {
        const row = document.createElement("div");
        row.className = "print-song";

        const number = document.createElement("span");
        number.className = "print-number";
        number.textContent =
          String(index + 1).padStart(2, "0") + ".";

        const name = document.createElement("span");
        name.className = "print-song-name";
        name.textContent = song.title;

        const duration = document.createElement("span");
        duration.className = "print-duration";
        duration.textContent = song.duration;

        row.append(number, name, duration);
        container.appendChild(row);
      });

      document.getElementById("printTotalTime").textContent =
        formatTime(getTotalSeconds(selectedSongs));

      // Aguarda a imagem antes de abrir a impressão.
      // Os nomes correspondem aos arquivos no GitHub.

      let printStarted = false;

      function openPrint() {
        if (printStarted) return;
        printStarted = true;
        window.print();
      }

      function logoError() {
        if (printStarted) return;

        alert(
          "Não foi possível carregar o logotipo.\n" +
          "Confira o arquivo: " + logoFile
        );
      }

      logo.onload = openPrint;
      logo.onerror = logoError;

      logo.src = logoFile;

      if (logo.complete && logo.naturalWidth > 0) {
        openPrint();
      }
    }
